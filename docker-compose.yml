services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:80"
    environment:
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:?set RAILS_MASTER_KEY to the contents of config/master.key}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD for the initial login}
    volumes:
      - storage:/rails/storage
    restart: unless-stopped

volumes:
  storage:
