name: CI & Deploy

# Gitea's counterpart of .github/workflows/ci.yml (Gitea runs only this
# file once .gitea/workflows exists; GitHub ignores it): the same checks,
# minus the Selenium system tests, plus a deploy job gated on all of them
# with `needs:`.
#
# The deploy job runs only on pushes to main, and only where a deployment
# is configured through these repository variables and secrets (so a fork
# or mirror without them simply skips it):
#   vars.KAMAL_DESTINATION      name of the Kamal destination, e.g. production
#   vars.KAMAL_DEPLOY_CONFIG    contents of config/deploy.<destination>.yml
#   vars.KAMAL_DEPLOY_SECRETS   contents of .kamal/secrets.<destination>
#   secrets.RAILS_MASTER_KEY    production config/master.key
#   secrets.KAMAL_REGISTRY_PASSWORD, secrets.KAMAL_DEPLOY_SSH_KEY
# The destination files are gitignored (they describe a particular
# server), hence variables.
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    # services:
    #  redis:
    #    image: valkey/valkey:8
    #    ports:
    #      - 6379:6379
    #    options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test

  deploy:
    needs: [ scan_ruby, scan_js, lint, test ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.KAMAL_DEPLOY_CONFIG != ''
    runs-on: ubuntu-latest
    env:
      DESTINATION: ${{ vars.KAMAL_DESTINATION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up SSH access to the deploy target
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.KAMAL_DEPLOY_SSH_KEY }}

      - name: Write the Kamal destination and secrets
        env:
          KAMAL_DEPLOY_CONFIG: ${{ vars.KAMAL_DEPLOY_CONFIG }}
          KAMAL_DEPLOY_SECRETS: ${{ vars.KAMAL_DEPLOY_SECRETS }}
        run: |
          printf '%s\n' "$KAMAL_DEPLOY_CONFIG" > "config/deploy.$DESTINATION.yml"
          printf '%s\n' "$KAMAL_DEPLOY_SECRETS" > ".kamal/secrets.$DESTINATION"
          echo 'RAILS_MASTER_KEY=$RAILS_MASTER_KEY' > .kamal/secrets-common

      # For a secrets file that runs plain `ssh` (e.g. to read a secret off
      # the server), which would otherwise stop at an unknown host key.
      - name: Trust the servers' host keys
        run: |
          mkdir -p ~/.ssh
          ruby -ryaml -e '
            servers = YAML.load_file(ARGV[0])["servers"]
            hosts = servers.is_a?(Hash) ? servers.values.flat_map { |role| role.is_a?(Hash) ? role["hosts"] : role } : servers
            puts hosts.map { |host| host.is_a?(Hash) ? host.keys.first : host }
          ' "config/deploy.$DESTINATION.yml" | xargs ssh-keyscan >> ~/.ssh/known_hosts

      - name: Deploy with Kamal
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
        run: bundle exec kamal deploy -d "$DESTINATION"
