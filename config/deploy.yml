# Deploying KCM with Kamal (https://kamal-deploy.org) to a server of your
# own. This file holds what every deployment shares; everything about your
# particular server goes into a destination file, config/deploy.<name>.yml
# (gitignored -- start from config/deploy.example.yml), which Kamal merges
# into this one:
#
#   bin/kamal setup -d <name>    # first deployment
#   bin/kamal deploy -d <name>
#
# Secrets come from .kamal/secrets-common and .kamal/secrets.<name> (both
# gitignored, see README).
service: kcm
image: kcm

env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    # Run the Solid Queue supervisor inside of Puma for single-server deployments.
    SOLID_QUEUE_IN_PUMA: true

# The SQLite databases live in storage/, which must survive redeploys.
volumes:
  - "kcm_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests.
asset_path: /rails/public/assets

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

builder:
  arch: amd64
